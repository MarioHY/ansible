- name: install Zabbix repo RPM
  yum:
    name: "{{ zabbix_repo_url }}"
    state: present

- name: install Zabbix Agent
  yum:
    name: zabbix-agent
    state: present

- name: configure Zabbix Agent conf
  template:
    src: zabbix_agentd.conf.j2
    dest: /etc/zabbix/zabbix_agentd.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart zabbix-agent server

- name: start and enable Zabbix Agent
  systemd:
    name: zabbix-agent
    state: started
    enabled: yes
