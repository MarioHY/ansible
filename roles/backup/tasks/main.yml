- name: Install Rsync Server
  yum:
    name: rsync
    state: present

- name: Configure Rsync Server
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  notify: restart rsync server
  loop:
    - src: rsyncd.conf.j2
      dest: /etc/rsyncd.conf
      mode: "0644"
    - src: rsync.passwd.j2
      dest: /etc/rsync.passwd
      mode: "0600"

- name: Create "{{ rsync_dir }}"
  file:
    path: "{{ rsync_dir }}"
    state: directory
    owner: "{{ rsync_user }}"
    group: "{{ rsync_user }}"

- name: Start Rsync Server
  systemd:
    name: rsyncd
    state: started
    enabled: yes

