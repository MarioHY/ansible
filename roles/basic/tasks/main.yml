- name: Disable and stop firewalld & NetworkManager
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  ignore_errors: yes
  loop:
    - firewalld
    - NetworkManager

- name: Disable SELinux
  selinux:
    state: disabled

- name: Set SELinux to premissive temporarily
  shell: setenforce 0
  failed_when: false
  changed_when: false

- name: Setup Chronyd
  block:
    - name: Install chrony
      yum:
        name: chrony
        state: present

    - name: Configure chrony.conf
      template:
        src: chrony.conf.j2
        dest: /etc/chrony.conf
      notify: restart chronyd

    - name: start chronyd
      systemd:
        name: chronyd
        state: started
        enabled: yes
  when: ntp_sync_method == "chronyd"

- name: Setup ntpdate crontab
  block:
    - name: Install ntpdate
      yum:
        name: ntpdate
        state: present

    - name: Create ntpdate cron job
      cron:
        name: "ntpdate time sync"
        minute: "*/5"
        job: "/usr/sbin/ntpdate {% for s in ntp_servers %}{{ s.split(' ')[0] }} {% endfor %} &> /dev/null"
  when: ntp_sync_method == "ntpdate"
  
- name: Configure YUM Repository
  block:
    - name: configure base
      yum_repository:
        name: CentOS-Base
        description: Aliyun YUM Base repo
        baseurl: http://mirrors.aliyun.com/centos/$releasever/os/$basearch/ 
        gpgcheck: yes
        gpgkey: http://mirrors.aliyun.com/centos/RPM-GPG-KEY-CentOS-7
        state: present
        enabled: yes

    - name: configure epel
      yum_repository:
        name: epel
        description: Aliyun YUM EPEL repo
        baseurl: http://mirrors.aliyun.com/epel/7/$basearch
        gpgcheck: yes
        gpgkey: https://mirrors.aliyun.com/epel/RPM-GPG-KEY-EPEL-7 
        state: present
        enabled: yes

    - name: configure nginx
      yum_repository:
        name: nginx
        description: Offical YUM Nginx repo
        baseurl: http://nginx.org/packages/centos/$releasever/$basearch/ 
        gpgcheck: yes
        gpgkey: https://nginx.org/keys/nginx_signing.key
        state: present
        enabled: yes

- name: Install all Basic Package(use loop to view)
  yum:
    name: "{{ item }}"
    state: present
  loop: "{{ basic_pack }}"


- name: Create group www
  group:
    name: www
    gid: 666

- name: Create User www
  user:
    name: www
    uid: 666
    group: www
    shell: /sbin/nologin
    create_home: false


